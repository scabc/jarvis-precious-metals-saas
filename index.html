<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis | 贵金属智能大屏终端</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Space+Mono:wght@400;700&display=swap');
        
        :root {
            --gold: #FFD700;
            --gold-muted: rgba(255, 215, 0, 0.1);
            --bg: #0A0A0B;
            --card: #141417;
            --border: rgba(255, 255, 255, 0.04);
            --text-main: #FFFFFF;
            --text-muted: #88888E;
        }

        body { 
            font-family: 'Bricolage Grotesque', sans-serif; 
            background-color: var(--bg); 
            color: var(--text-main); 
            letter-spacing: -0.02em;
            background-image: radial-gradient(circle at 50% -20%, #1a1a1e 0%, var(--bg) 80%);
        }

        .mono { font-family: 'Space Mono', monospace; }

        .glass-card { 
            background: var(--card);
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }
        .glass-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 215, 0, 0.2);
            box-shadow: 0 20px 40px -15px rgba(0,0,0,0.7), 0 0 20px rgba(255, 215, 0, 0.05);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: -1;
            mask-image: radial-gradient(circle at 50% 50%, black, transparent);
        }

        .metal-tab {
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.1em;
            transition: all 0.3s ease;
            border: 1px solid var(--border);
            background: #111;
            color: var(--text-muted);
            cursor: pointer;
        }
        .metal-tab.active {
            background: var(--gold);
            color: #000;
            border-color: var(--gold);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
        }

        .scanline {
            width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            position: absolute; top: 0; left: 0;
            opacity: 0.1;
            animation: scan 4s linear infinite;
        }
        @keyframes scan { 0% { top: -10%; } 100% { top: 110%; } }

        .ticker-wrap { overflow: hidden; background: #000; border-bottom: 1px solid #222; position: fixed; top: 0; left: 0; width: 100%; z-index: 100; }
        .ticker { display: flex; white-space: nowrap; padding: 12px 0; animation: ticker 40s linear infinite; }
        @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .ticker-item { padding: 0 30px; border-right: 1px solid #222; display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: bold; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="min-h-screen pt-24 selection:bg-amber-500 selection:text-black">
    <div class="ticker-wrap">
        <div id="ticker-content" class="ticker"></div>
    </div>

    <header class="w-full max-w-7xl mx-auto px-6 flex justify-between items-center py-10">
        <h1 class="text-3xl font-black tracking-tighter flex items-center gap-2">
            <span class="w-2 h-8 bg-amber-500 rounded-full"></span> JARVIS
        </h1>
        <div id="auth-status" class="flex items-center gap-6 text-[10px] font-black uppercase tracking-widest text-neutral-500"></div>
    </header>

    <main id="main-content" class="w-full max-w-7xl mx-auto px-6 pb-32 space-y-16">
        <!-- 访客引导页 -->
        <section id="guest-hero" class="text-center py-20 space-y-8">
            <h2 class="text-7xl font-black tracking-tighter">智能贵金属<br><span class="text-amber-500 italic">实时监控终端</span></h2>
            <p class="text-neutral-500 max-w-xl mx-auto font-medium">聚合 12 家主流银行实时牌价，全天候云端扫描。为专业交易者设计的极速波动预警。</p>
            <div class="flex flex-col sm:flex-row justify-center gap-4 pt-6">
                <input type="email" id="login-email" placeholder="输入邮箱开通监控..." class="bg-neutral-900 border border-white/5 rounded-2xl px-6 py-4 w-full sm:w-80 focus:outline-none focus:border-amber-500">
                <button onclick="login()" id="login-btn" class="bg-amber-500 text-black font-black px-10 py-4 rounded-2xl hover:bg-amber-600 transition">立即开启</button>
            </div>
        </section>

        <!-- 仪表盘内容 -->
        <div id="dashboard-content" class="space-y-16 hidden">
            <section class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <div class="glass-card p-10 rounded-3xl group">
                    <div class="scanline"></div>
                    <div class="text-[10px] font-black text-amber-500 uppercase tracking-widest mb-8">SGE / 上海现货</div>
                    <div class="flex flex-col"><span id="price-sh" class="text-6xl font-black mono mb-2">---</span><span class="text-[10px] text-neutral-600 font-bold uppercase tracking-widest">CNY / GRAM</span></div>
                </div>
                <div class="glass-card p-10 rounded-3xl group">
                    <div class="text-[10px] font-black text-blue-500 uppercase tracking-widest mb-8">COMEX / 纽约期货</div>
                    <div class="flex flex-col"><span id="price-ny" class="text-6xl font-black mono mb-2">---</span><span class="text-[10px] text-neutral-600 font-bold uppercase tracking-widest">USD / OUNCE</span></div>
                </div>
                <div class="glass-card p-10 rounded-3xl group">
                    <div class="text-[10px] font-black text-purple-500 uppercase tracking-widest mb-8">XAU / 伦敦现货</div>
                    <div class="flex flex-col"><span id="price-ln" class="text-6xl font-black mono mb-2">---</span><span class="text-[10px] text-neutral-600 font-bold uppercase tracking-widest">USD / OUNCE</span></div>
                </div>
            </section>

            <section class="flex flex-col md:flex-row justify-between items-end gap-8 border-t border-white/5 pt-12">
                <div class="space-y-6">
                    <div class="text-[10px] font-black text-neutral-500 uppercase tracking-widest">Asset Category</div>
                    <div class="flex gap-2">
                        <button onclick="switchMetal('黄金')" id="btn-gold" class="metal-tab active">Gold 黄金</button>
                        <button onclick="switchMetal('白银')" id="btn-silver" class="metal-tab">Silver 白银</button>
                    </div>
                </div>
                <div class="flex items-center gap-8 bg-neutral-900/30 p-2 rounded-2xl border border-white/5">
                    <div class="px-6 py-2"><div class="text-[9px] text-neutral-600 font-black uppercase mb-1">Exchange Rate</div><div id="cny-rate-val" class="text-lg font-black mono">7.25</div></div>
                    <div class="h-10 w-px bg-white/5"></div>
                    <div class="px-6 py-2 pr-10"><div class="text-[9px] text-neutral-600 font-black uppercase mb-1">Source Health</div><div id="source-status" class="flex gap-1 items-center"></div></div>
                </div>
            </section>

            <section id="price-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></section>
        </div>
    </main>

    <script>
        const SUPABASE_URL = "https://xoatcihvsyeluiahctuz.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_qPoLPXTl5kxJM90zTIqYbA_2OJx3cPz";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        _supabase.auth.onAuthStateChange((event, session) => {
            const guestHero = document.getElementById('guest-hero');
            const dashboard = document.getElementById('dashboard-content');
            const authStatus = document.getElementById('auth-status');
            if (session) {
                authStatus.innerHTML = `<span>${session.user.email}</span> <button onclick="_supabase.auth.signOut()">Logout</button>`;
                guestHero.classList.add('hidden');
                dashboard.classList.remove('hidden');
            } else {
                guestHero.classList.remove('hidden');
                dashboard.classList.add('hidden');
            }
            fetchPrices();
        });

        async function login() {
            const email = document.getElementById('login-email').value;
            await _supabase.auth.signInWithOtp({ email });
            alert('Check your email!');
        }

        let currentMetalType = '黄金';
        function renderTicker(data) {
            const ticker = document.getElementById('ticker-content');
            if (!ticker) return;
            ticker.innerHTML = '';
            const items = [...data, ...data]; // Double for seamless loop
            items.forEach(item => {
                const color = item.f3 > 0 ? 'text-green-400' : 'text-red-400';
                ticker.insertAdjacentHTML('beforeend', `
                    <div class="ticker-item">
                        <span class="text-neutral-500">${item.f14}</span>
                        <span class="mono ${color}">${item.f2}</span>
                        <span class="text-[10px] ${color}">${item.f3 > 0 ? '▲' : '▼'}${Math.abs(item.f3)}%</span>
                    </div>
                `);
            });
        }

        function updateSourceStatus(emOk, sinaOk) {
            const status = document.getElementById('source-status');
            if (!status) return;
            status.innerHTML = `
                <div class="flex gap-1">
                    <div class="w-1.5 h-1.5 rounded-full ${emOk ? 'bg-green-500' : 'bg-red-500'}"></div>
                    <div class="w-1.5 h-1.5 rounded-full ${sinaOk ? 'bg-green-500' : 'bg-red-500'}"></div>
                </div>
            `;
        }

        function switchMetal(type) {
            currentMetalType = type;
            document.querySelectorAll('.metal-tab').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${type === '黄金' ? 'gold' : 'silver'}`).classList.add('active');
            fetchPrices();
        }

        async function fetchPrices() {
            try {
                // 浏览器环境下使用代理规避 CORS 666/403 错误
                const proxy = "https://api.allorigins.win/raw?url=";
                const [emRes, sinaRes, bankRes] = await Promise.allSettled([
                    fetch("https://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=30&po=1&np=1&ut=bd1d9ddb040897f3cf9c27f6f7426281&fltt=2&invt=2&fid=f3&fs=m:118,m:119,m:120,m:121&fields=f12,f14,f2,f3").then(r => r.json()),
                    fetch(proxy + encodeURIComponent("https://hq.sinajs.cn/list=hf_XAU,hf_GC")).then(r => r.text()),
                    fetch(proxy + encodeURIComponent("https://api.jijinhao.com/quoteCenter/realTime.htm?codes=JO_9753,JO_71,JO_70,JO_73,JO_9754&_=" + Date.now())).then(r => r.text())
                ]);

                if (emRes.status === 'fulfilled') {
                    const shGold = emRes.value.data.diff.find(i => i.f14 === 'AU9999');
                    if (shGold) document.getElementById('price-sh').innerText = shGold.f2;
                }
                
                if (sinaRes.status === 'fulfilled') {
                    const xau = sinaRes.value.match(/hf_XAU="([^"]*)"/);
                    if (xau) document.getElementById('price-ln').innerText = parseFloat(xau[1].split(',')[0]).toFixed(2);
                    const gc = sinaRes.value.match(/hf_GC="([^"]*)"/);
                    if (gc) document.getElementById('price-ny').innerText = parseFloat(gc[1].split(',')[0]).toFixed(2);
                }

                if (bankRes.status === 'fulfilled') {
                    const m = bankRes.value.match(/\{.*\}/);
                    if (m) {
                        const raw = JSON.parse(m[0]);
                        const CODE_MAP = { "JO_9753": "工商银行", "JO_71": "建设银行", "JO_70": "中国银行", "JO_73": "农业银行", "JO_9754": "招商银行" };
                        const grid = document.getElementById('price-grid');
                        grid.innerHTML = '';
                        Object.keys(raw).forEach(code => {
                            if (CODE_MAP[code]) {
                                const b = raw[code];
                                if (currentMetalType === '黄金' && b.q2 > 2000) return;
                                grid.insertAdjacentHTML('beforeend', `
                                    <div class="glass-card p-8 rounded-3xl border-white/5">
                                        <div class="text-[11px] font-black text-amber-500 uppercase mb-6">${CODE_MAP[code]}</div>
                                        <div class="text-4xl font-black mono mb-4">${b.q1}</div>
                                        <div class="flex justify-between text-xs text-neutral-500"><span>买入: ${b.q2}</span><span>点差: ${(b.q1-b.q2).toFixed(2)}</span></div>
                                    </div>
                                `);
                            }
                        });
                    }
                }
                
                // 执行渲染
                if (emRes.status === 'fulfilled') renderTicker(emRes.value.data.diff);
                updateSourceStatus(emRes.status === 'fulfilled', sinaRes.status === 'fulfilled');
            } catch (e) { console.error(e); }
        }
        setInterval(fetchPrices, 10000);
        fetchPrices();
    </script>
</body>
</html>
