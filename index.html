<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis | 贵金属智能大屏终端</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Space+Mono:wght@400;700&display=swap');
        
        /* 新增走势图容器样式 */
        .sparkline-container { height: 40px; width: 100%; margin-top: 10px; opacity: 0.6; }
        /* 支付二维码样式 */
        .qr-code { width: 200px; height: 200px; background: white; margin: 0 auto; padding: 10px; border-radius: 12px; }
        
        :root {
            --gold: #FFD700;
            --gold-muted: rgba(255, 215, 0, 0.1);
            --bg: #0A0A0B;
            --card: #141417;
            --border: rgba(255, 255, 255, 0.04);
            --text-main: #FFFFFF;
            --text-muted: #88888E;
        }

        body { 
            font-family: 'Bricolage Grotesque', sans-serif; 
            background-color: var(--bg); 
            color: var(--text-main); 
            letter-spacing: -0.02em;
            background-image: radial-gradient(circle at 50% -20%, #1a1a1e 0%, var(--bg) 80%);
        }

        .mono { font-family: 'Space Mono', monospace; }

        .glass-card { 
            background: var(--card);
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }
        .glass-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 215, 0, 0.2);
            box-shadow: 0 20px 40px -15px rgba(0,0,0,0.7), 0 0 20px rgba(255, 215, 0, 0.05);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: -1;
            mask-image: radial-gradient(circle at 50% 50%, black, transparent);
        }

        .metal-tab {
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.1em;
            transition: all 0.3s ease;
            border: 1px solid var(--border);
            background: #111;
            color: var(--text-muted);
            cursor: pointer;
        }
        .metal-tab.active {
            background: var(--gold);
            color: #000;
            border-color: var(--gold);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
        }

        .scanline {
            width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            position: absolute; top: 0; left: 0;
            opacity: 0.1;
            animation: scan 4s linear infinite;
        }
        @keyframes scan { 0% { top: -10%; } 100% { top: 110%; } }

        .ticker-wrap { overflow: hidden; background: #000; border-bottom: 1px solid #222; position: fixed; top: 0; left: 0; width: 100%; z-index: 100; }
        .ticker { display: flex; white-space: nowrap; padding: 12px 0; animation: ticker 40s linear infinite; }
        @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .ticker-item { padding: 0 30px; border-right: 1px solid #222; display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: bold; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="min-h-screen pt-24 selection:bg-amber-500 selection:text-black">
    <div class="ticker-wrap">
        <div id="ticker-content" class="ticker"></div>
    </div>

    <header class="w-full max-w-7xl mx-auto px-6 flex justify-between items-center py-10">
        <h1 class="text-3xl font-black tracking-tighter flex items-center gap-2">
            <span class="w-2 h-8 bg-amber-500 rounded-full"></span> JARVIS
        </h1>
        <div id="auth-status" class="flex items-center gap-6 text-[10px] font-black uppercase tracking-widest text-neutral-500"></div>
    </header>

    <main id="main-content" class="w-full max-w-7xl mx-auto px-6 pb-32 space-y-16">
        <!-- 访客引导页 -->
        <section id="guest-hero" class="text-center py-20 space-y-8">
            <h2 class="text-7xl font-black tracking-tighter">智能贵金属<br><span class="text-amber-500 italic">实时监控终端</span></h2>
            <p class="text-neutral-500 max-w-xl mx-auto font-medium">聚合 12 家主流银行实时牌价，全天候云端扫描。为专业交易者设计的极速波动预警。</p>
            <div class="flex flex-col sm:flex-row justify-center gap-4 pt-6">
                <input type="email" id="login-email" placeholder="输入邮箱开通监控..." class="bg-neutral-900 border border-white/5 rounded-2xl px-6 py-4 w-full sm:w-80 focus:outline-none focus:border-amber-500">
                <button onclick="login()" id="login-btn" class="bg-amber-500 text-black font-black px-10 py-4 rounded-2xl hover:bg-amber-600 transition">立即开启</button>
            </div>
        </section>

        <!-- 仪表盘内容 -->
        <div id="dashboard-content" class="space-y-16 hidden">
            <!-- 顶部状态控制条 -->
            <section class="flex flex-col md:flex-row justify-between items-center gap-6 bg-neutral-900/50 p-6 rounded-3xl border border-white/5">
                <div class="flex items-center gap-8">
                    <div id="trial-timer" class="flex flex-col">
                        <span class="text-[9px] text-neutral-500 font-black uppercase tracking-widest mb-1">试用期剩余时间 / Trial</span>
                        <span id="countdown-clock" class="text-xl font-black mono text-amber-500">00:00:00</span>
                    </div>
                    <div class="h-8 w-px bg-white/5"></div>
                    <div class="flex flex-col">
                        <span class="text-[9px] text-neutral-500 font-black uppercase tracking-widest mb-1">基准参考银行 / Bank</span>
                        <select id="main-bank-selector" onchange="fetchPrices()" class="bg-transparent text-sm font-bold focus:outline-none cursor-pointer">
                            <option value="中国银行" class="bg-neutral-900">中国银行 (BOC)</option>
                            <option value="工商银行" class="bg-neutral-900">工商银行 (ICBC)</option>
                            <option value="招商银行" class="bg-neutral-900">招商银行 (CMB)</option>
                        </select>
                    </div>
                    <div id="plan-badge-container"></div>
                </div>
                <div class="flex gap-4">
                    <button onclick="showPayModal()" class="px-4 py-2 bg-white/5 hover:bg-white/10 rounded-xl text-[10px] font-black transition border border-white/5">💎 升级 PRO</button>
                </div>
            </section>

            <section class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <div class="glass-card p-10 rounded-3xl group">
                    <div class="scanline"></div>
                    <div class="text-[10px] font-black text-amber-500 uppercase tracking-widest mb-8">SGE / 上海现货</div>
                    <div class="flex flex-col"><span id="price-sh" class="text-6xl font-black mono mb-2">---</span><span class="text-[10px] text-neutral-600 font-bold uppercase tracking-widest">CNY / GRAM</span></div>
                    <div class="sparkline-container"><canvas id="chart-sh"></canvas></div>
                </div>
                <div class="glass-card p-10 rounded-3xl group">
                    <div class="text-[10px] font-black text-blue-500 uppercase tracking-widest mb-8">COMEX / 纽约期货</div>
                    <div class="flex flex-col"><span id="price-ny" class="text-6xl font-black mono mb-2">---</span><span class="text-[10px] text-neutral-600 font-bold uppercase tracking-widest">USD / OUNCE</span></div>
                    <div class="sparkline-container"><canvas id="chart-ny"></canvas></div>
                </div>
                <div class="glass-card p-10 rounded-3xl group">
                    <div class="text-[10px] font-black text-purple-500 uppercase tracking-widest mb-8">XAU / 伦敦现货</div>
                    <div class="flex flex-col"><span id="price-ln" class="text-6xl font-black mono mb-2">---</span><span class="text-[10px] text-neutral-600 font-bold uppercase tracking-widest">USD / OUNCE</span></div>
                    <div class="sparkline-container"><canvas id="chart-ln"></canvas></div>
                </div>
            </section>

            <section class="flex flex-col md:flex-row justify-between items-end gap-8 border-t border-white/5 pt-12">
                <div class="space-y-6">
                    <div class="text-[10px] font-black text-neutral-500 uppercase tracking-widest">Asset Category</div>
                    <div class="flex gap-2">
                        <button onclick="switchMetal('黄金')" id="btn-gold" class="metal-tab active">Gold 黄金</button>
                        <button onclick="switchMetal('白银')" id="btn-silver" class="metal-tab">Silver 白银</button>
                    </div>
                </div>
                <div class="flex items-center gap-8 bg-neutral-900/30 p-2 rounded-2xl border border-white/5">
                    <div class="px-6 py-2"><div class="text-[9px] text-neutral-600 font-black uppercase mb-1">实时汇率 / Rate</div><div id="cny-rate-val" class="text-lg font-black mono">7.25</div></div>
                    <div class="h-10 w-px bg-white/5"></div>
                    <div class="px-6 py-2 pr-10"><div class="text-[9px] text-neutral-600 font-black uppercase mb-1">接口健康 / Health</div><div id="source-status" class="flex gap-1 items-center"></div></div>
                </div>
            </section>

            <section id="price-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 pb-32"></section>
        </div>
    </main>

    <!-- 支付弹窗 -->
    <div id="pay-modal" class="fixed inset-0 bg-black/95 backdrop-blur-md hidden items-center justify-center p-4 z-[200]">
        <div class="glass-card max-w-md w-full p-12 rounded-[3rem] text-center space-y-8 border-amber-500/50">
            <h3 class="text-3xl font-black">Jarvis PRO 升级</h3>
            <div class="py-6 bg-white/5 rounded-3xl">
                <div class="text-5xl font-black">¥9.9 <span class="text-xs text-neutral-500">/ 月</span></div>
            </div>
            <div class="space-y-4">
                <div class="qr-code">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=https://scabc.github.io/jarvis-precious-metals-saas/pay-success.html" alt="Pay QR">
                </div>
                <p class="text-[10px] text-neutral-500 font-bold">扫码支付后系统将自动激活 PRO 权限</p>
            </div>
            <button onclick="hidePayModal()" class="text-xs text-neutral-500 font-bold uppercase tracking-widest">取消支付</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://xoatcihvsyeluiahctuz.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_qPoLPXTl5kxJM90zTIqYbA_2OJx3cPz";
        const TANSHU_KEY = "b727cdcd823c72ac3b416d92e1423bc1";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let expireDate = null;

        let priceHistory = { sh: [], ny: [], ln: [] };
        let charts = {};

        function initCharts() {
            ['sh', 'ny', 'ln'].forEach(id => {
                const ctx = document.getElementById(`chart-${id}`).getContext('2d');
                charts[id] = new Chart(ctx, {
                    type: 'line',
                    data: { labels: new Array(20).fill(''), datasets: [{ data: [], borderColor: '#FFD700', borderWidth: 1.5, tension: 0.4, pointRadius: 0 }] },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } } }
                });
            });
        }

        function updateChart(id, price) {
            if (!charts[id] || isNaN(price)) return;
            try {
                const data = charts[id].data.datasets[0].data;
                data.push(price);
                if (data.length > 20) data.shift();
                charts[id].update('none');
            } catch (e) {
                console.warn("Chart update failed:", e);
                // 如果图表失效，尝试重新初始化
                initCharts();
            }
        }

        _supabase.auth.onAuthStateChange(async (event, session) => {
            const guestHero = document.getElementById('guest-hero');
            const dashboard = document.getElementById('dashboard-content');
            const authStatus = document.getElementById('auth-status');
            
            console.log("Auth Event:", event, session);

            if (session) {
                currentUser = session.user;
                authStatus.innerHTML = `
                    <button onclick="window.location.href='account.html'" class="hover:text-amber-500 transition">个人中心</button>
                    <span class="w-1 h-1 bg-neutral-800 rounded-full"></span>
                    <button onclick="_supabase.auth.signOut()" class="hover:text-white transition">退出</button>
                `;
                guestHero.classList.add('hidden');
                dashboard.classList.remove('hidden');
                
                // 确保在渲染前初始化图表
                if (Object.keys(charts).length === 0) initCharts();
                
                await loadUserData();
                startCountdown();
            } else {
                currentUser = null;
                guestHero.classList.remove('hidden');
                dashboard.classList.add('hidden');
                authStatus.innerHTML = `<button onclick="document.getElementById('login-email').focus()">登录 / 注册</button>`;
            }
            fetchPrices();
        });

        async function login() {
            const email = document.getElementById('login-email').value;
            if (!email) return;
            const btn = document.getElementById('login-btn');
            const originalText = btn.innerText;
            btn.innerText = '发送中...';
            btn.disabled = true;

            // 核心修复：GitHub Pages 对路径极其敏感，直接使用当前干净的 URL 作为重定向地址
            // 去掉现有的 # (Token) 或 ? (参数)，获取最纯净的当前页面路径
            const redirectTo = window.location.href.split('#')[0].split('?')[0];
            console.log("最终重定向地址 (redirectTo):", redirectTo);

            const { error } = await _supabase.auth.signInWithOtp({ 
                email,
                options: {
                    emailRedirectTo: redirectTo
                }
            });

            if (error) {
                alert('错误: ' + error.message);
                btn.innerText = originalText;
                btn.disabled = false;
            } else {
                alert('登录链接已发送！\n\n请务必在【电脑浏览器】中打开邮件链接，不要在手机上打开。');
                btn.innerText = '邮件已发送';
            }
        }

        async function loadUserData() {
            const { data } = await _supabase.from('subscriptions').select('*').eq('if_user_id', currentUser.id).single();
            if (data) {
                expireDate = new Date(data.expires_at);
                const badge = document.getElementById('plan-badge-container');
                if (data.plan === 'PRO') {
                    badge.innerHTML = '<span class="px-2 py-0.5 bg-amber-500 text-black rounded text-[9px] font-black">PRO</span>';
                }
            }
        }

        function startCountdown() {
            setInterval(() => {
                if (!expireDate) return;
                const now = new Date();
                const diff = expireDate - now;
                const clock = document.getElementById('countdown-clock');
                if (diff <= 0) { clock.innerText = "已过期"; }
                else {
                    const h = Math.floor(diff / 3600000).toString().padStart(2, '0');
                    const m = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
                    const s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                    clock.innerText = `${h}:${m}:${s}`;
                }
            }, 1000);
        }

        function showPayModal() { document.getElementById('pay-modal').style.display = 'flex'; }
        function hidePayModal() { document.getElementById('pay-modal').style.display = 'none'; }

        let currentMetalType = '黄金';
        function renderTicker(data) {
            const ticker = document.getElementById('ticker-content');
            if (!ticker) return;
            ticker.innerHTML = '';
            const items = [...data, ...data];
            items.forEach(item => {
                const color = item.f3 > 0 ? 'text-green-400' : 'text-red-400';
                ticker.insertAdjacentHTML('beforeend', `
                    <div class="ticker-item">
                        <span class="text-neutral-500">${item.f14}</span>
                        <span class="mono ${color}">${item.f2}</span>
                        <span class="text-[10px] ${color}">${item.f3 > 0 ? '▲' : '▼'}${Math.abs(item.f3)}%</span>
                    </div>
                `);
            });
        }

        function updateSourceStatus(emOk, sinaOk) {
            const status = document.getElementById('source-status');
            if (!status) return;
            status.innerHTML = `
                <div class="flex gap-1">
                    <div class="w-1.5 h-1.5 rounded-full ${emOk ? 'bg-green-500' : 'bg-red-500'}"></div>
                    <div class="w-1.5 h-1.5 rounded-full ${sinaOk ? 'bg-green-500' : 'bg-red-500'}"></div>
                </div>
            `;
        }

        function switchMetal(type) {
            currentMetalType = type;
            document.querySelectorAll('.metal-tab').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${type === '黄金' ? 'gold' : 'silver'}`).classList.add('active');
            fetchPrices();
        }

        async function fetchPrices() {
            try {
                // 增加更多、更分散的备选代理
                const proxies = [
                    "https://api.allorigins.win/raw?url=",
                    "https://api.codetabs.com/v1/proxy?quest=",
                    "https://corsproxy.io/?url=",
                    "https://api.proxyscrape.com/v2/?request=proxyinfo&url="
                ];
                
                async function fetchWithProxy(url) {
                    // 随机打乱代理顺序，避免总是撞在同一个代理上
                    const shuffled = proxies.sort(() => Math.random() - 0.5);
                    for (const p of shuffled) {
                        try {
                            const res = await fetch(p + encodeURIComponent(url), { signal: AbortSignal.timeout(5000) });
                            if (res.ok) {
                                const text = await res.text();
                                if (text && text.length > 10) return text; // 确保拿到了有效内容
                            }
                        } catch (e) {}
                    }
                    return null;
                }

                // 优先从 Supabase 获取后端同步的商业权威价 (每15分钟更新一次)
                const { data: globalData } = await _supabase.from('global_settings').select('reference_prices').eq('id', 1).single();
                const officialRef = globalData?.reference_prices || {};

                // 并行抓取：实时源 + 银行源
                const [sinaText, bankText] = await Promise.all([
                    fetchWithProxy("https://hq.sinajs.cn/list=hf_XAU,hf_GC,hf_SI"),
                    fetchWithProxy("https://api.jijinhao.com/quoteCenter/realTime.htm?codes=JO_9753,JO_71,JO_70,JO_73,JO_9754,JO_9758,JO_42691,JO_42681")
                ]);

                // 1. 处理大盘数据 (优先实时源，失败则用数据库官方价)
                let lnPrice, nyPrice;
                if (sinaText) {
                    const xau = sinaText.match(/hq_str_hf_XAU="(.*?)"/);
                    if (xau) lnPrice = parseFloat(xau[1].split(',')[0]);
                    const gc = sinaText.match(/hq_str_hf_GC="(.*?)"/);
                    if (gc) nyPrice = parseFloat(gc[1].split(',')[0]);
                }
                
                // 如果实时源挂了，使用极速/探数同步过来的官方价
                if (!lnPrice && officialRef["国际金银铂钯期货_伦敦金"]) lnPrice = parseFloat(officialRef["国际金银铂钯期货_伦敦金"]);
                if (!nyPrice && officialRef["国际金银铂钯期货_伦敦金"]) nyPrice = parseFloat(officialRef["国际金银铂钯期货_伦敦金"]);

                if (lnPrice) {
                    document.getElementById('price-ln').innerText = lnPrice.toFixed(2);
                    updateChart('ln', lnPrice);
                }
                if (nyPrice) {
                    document.getElementById('price-ny').innerText = nyPrice.toFixed(2);
                    updateChart('ny', nyPrice);
                }

                // 2. 处理银行数据
                if (bankText) {
                    const m = bankText.match(/\{.*\}/);
                    if (m) {
                        const raw = JSON.parse(m[0]);
                        const GOLD_MAP = { "JO_9753": "工商银行", "JO_71": "建设银行", "JO_70": "中国银行", "JO_73": "农业银行", "JO_9754": "招商银行" };
                        const SILVER_MAP = { "JO_9758": "工商白银", "JO_42691": "建设白银", "JO_42681": "招商白银" };
                        const grid = document.getElementById('price-grid');
                        grid.innerHTML = '';
                        const activeMap = currentMetalType === '黄金' ? GOLD_MAP : SILVER_MAP;

                        Object.keys(raw).forEach(code => {
                            if (activeMap[code]) {
                                const b = raw[code];
                                if (currentMetalType === '黄金' && b.q2 > 2000) return;
                                if (currentMetalType === '白银' && b.q2 > 100) return;
                                grid.insertAdjacentHTML('beforeend', `
                                    <div class="glass-card p-8 rounded-3xl border-white/5">
                                        <div class="text-[11px] font-black text-amber-500 uppercase mb-6">${activeMap[code]}</div>
                                        <div class="text-4xl font-black mono mb-4">${b.q1}</div>
                                        <div class="flex justify-between text-xs text-neutral-500"><span>买入: ${b.q2}</span><span>点差: ${(b.q1-b.q2).toFixed(2)}</span></div>
                                    </div>
                                `);
                            }
                        });
                    }
                }
                
                updateSourceStatus(!!sinaText, !!bankText);
            } catch (e) { console.error("Fetch Error:", e); }
        }
        // 降低频率至 20 秒，减少被封风险
        setInterval(fetchPrices, 20000);
        fetchPrices();
            } catch (e) { console.error(e); }
        }
        setInterval(fetchPrices, 10000);
        fetchPrices();
    </script>
</body>
</html>
