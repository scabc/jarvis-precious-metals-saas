name: Jarvis Global Sync

on:
  schedule:
    - cron: '0 */2 * * *'  # 每 2 小时运行一次（每天 12 次）
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests>=2.31.0 beautifulsoup4>=4.12.0 PySocks>=1.7.1 'supabase>=2.0.0,<3.0.0' 'httpx>=0.24.0'

      - name: Run Global Sync Task
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          JISU_KEY: ${{ secrets.JISU_KEY }}
          TANSHU_KEY: ${{ secrets.TANSHU_KEY }}
          GITHUB_ACTIONS: "true"
        run: |
          echo "Current Path: $(pwd)"
          python3 gh_entry.py
